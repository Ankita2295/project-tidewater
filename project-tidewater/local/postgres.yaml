apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels: { app: postgres }
spec:
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:15
          args: ["-c", "max_connections=100", "-c", "statement_timeout=8000"]
          env:
            - name: POSTGRES_DB
              value: settle
            - name: POSTGRES_USER
              value: settle_app
            - name: POSTGRES_PASSWORD
              value: local-dev-only-not-a-real-secret
          ports:
            - containerPort: 5432
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "settle_app"] }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
