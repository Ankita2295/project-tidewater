# Applied via nginx-ingress ConfigMap / server-snippet.
# Root cause note: original config had no request rate limiting and a
# single global proxy_read_timeout too short for /reports/daily (6-9s),
# which caused nginx to return 504 on legitimately slow-but-healthy
# requests, adding to perceived error rate during the incident.

limit_req_zone $binary_remote_addr zone=settle_rl:10m rate=50r/s;

server {
    # per-location timeout override for the slow reporting endpoint
    location /reports/daily {
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        limit_req zone=settle_rl burst=20 nodelay;
        proxy_pass http://settle-api;
    }

    location / {
        proxy_read_timeout 8s;
        proxy_send_timeout 8s;
        limit_req zone=settle_rl burst=100 nodelay;
        proxy_pass http://settle-api;
    }

    client_max_body_size 2m;
    client_body_timeout 10s;

    # don't leak backend/server details in error responses
    server_tokens off;
    proxy_hide_header X-Powered-By;
}
